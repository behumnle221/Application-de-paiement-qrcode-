name: qrcode
description: "Application de paiement par QR code"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0   # Indispensable pour la police Inter
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  http: ^1.1.0
  url_launcher: ^6.3.0
  go_router: ^17.1.0
  shared_preferences: ^2.2.0
  uuid: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/qr_illustration.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icone.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icone.png"
