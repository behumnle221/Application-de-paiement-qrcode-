# ====================== Gradle JVM Configuration ======================
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m \
                   -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ====================== Gradle Performance ======================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.file.watch.enabled=false

# ====================== Android Specific ======================
android.useAndroidX=true
android.enableJetifier=true

# Timeout plus long (en secondes) pour les gros builds
org.gradle.timeout=1800
                                                                